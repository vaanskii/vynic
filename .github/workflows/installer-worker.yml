name: Qualified installer Worker deployment
run-name: Worker ${{ inputs.approved_sha }} (deploy=${{ inputs.deploy }})
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Reviewed full main commit (must equal this run SHA)
        required: true
        type: string
      deploy:
        description: Deploy after checks and protected-environment approval
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: installer-worker-production
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'vaanskii/vynic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/installer-worker
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Require the exact approved source
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:dry-run
  deploy:
    needs: check
    if: inputs.deploy && github.repository == 'vaanskii/vynic' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: installer-worker-production
    defaults:
      run:
        working-directory: apps/installer-worker
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
          package-manager-cache: false
      - name: Recheck approved source and activation gate
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          DEPLOY_ENABLED: ${{ vars.VYNIC_WORKER_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$APPROVED_SHA" ]]
          [[ "$DEPLOY_ENABLED" == true ]]
      - run: npm ci
      - run: npm run check
      - name: Upload and activate only the returned version; verify 100 percent traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INSTALLER_WORKER_DEPLOY_TOKEN }}
          WORKERS_CI_BRANCH: ${{ github.ref_name }}
          VYNIC_WORKER_DEPLOY_ENABLED: ${{ vars.VYNIC_WORKER_DEPLOY_ENABLED }}
          WRANGLER_SEND_METRICS: 'false'
        run: npm run deploy
