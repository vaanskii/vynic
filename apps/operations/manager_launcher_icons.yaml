# Vynic Manager app icon. The checked-in native icon slots stay Vynic POS
# (see `flutter_launcher_icons` in pubspec.yaml); this config renders the
# Manager mark into `branding/manager/`, which `tool/product.py` lays over the
# staged tree for manager builds. Regenerate with
# `python3 tools/brand/generate_app_icons.py` from the repository root.
# (Not named `flutter_launcher_icons-*.yaml`: that pattern switches the
# package into flavor mode and writes Android/iOS icons to flavor paths.)
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logo/manager_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F7F6F4"
  adaptive_icon_foreground: "assets/logo/manager_adaptive_fg.png"
  windows:
    generate: true
    image_path: "assets/logo/manager_app_icon.png"
  macos:
    generate: true
    image_path: "assets/logo/manager_app_icon.png"
