services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: vynic
      POSTGRES_DB: vynic_local_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    networks: [database]
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vynic -d vynic_local_prod"]
      interval: 5s
      timeout: 3s
      retries: 12
  migrate:
    environment:
      DATABASE_URL: postgresql://vynic:${POSTGRES_PASSWORD}@postgres:5432/vynic_local_prod
    depends_on:
      postgres: {condition: service_healthy}
  backend:
    environment:
      DATABASE_URL: postgresql://vynic:${POSTGRES_PASSWORD}@postgres:5432/vynic_local_prod
      VYNIC_LOCAL_DOCKER: "true"
  reverse-proxy:
    ports: ["127.0.0.1:80:8080"]
volumes:
  postgres-data:
