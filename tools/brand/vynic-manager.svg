  <g transform="translate(12.9 12.9) scale(0.742)" fill="none" stroke="#111112" stroke-linecap="round">
    <path d="M22 26 L52 72" stroke-width="19"/>
    <path d="M52 72 L84 18" stroke-width="11"/>
    <path d="M84 18 L84 70" stroke-width="11"/>
